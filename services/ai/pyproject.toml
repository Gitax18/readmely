[project]
name = "readmely-ai"
version = "0.1.0"
description = "Readmely AI service: all LLM work (internal only)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.163.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs the local Postgres from `make up`"]
addopts = "-m 'not integration' --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "N", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "PLC0415", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]
