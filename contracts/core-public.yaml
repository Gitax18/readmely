openapi: 3.0.3
info:
  title: Readmely core API (public listener)
  version: 0.1.0
  description: >-
    What the internet-facing port of the Go API serves. Readiness and status are NOT here: they are on the internal listener.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      responses:
        '200':
          description: The process is alive. Never touches a dependency.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              example:
                status: ok
        '405':
          description: Method not allowed (method_not_allowed).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Any other error, such as an unknown route (not_found) or an unexpected failure (internal_error).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  headers:
    RequestId:
      description: The request ID, echoed back or generated by the server.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{8,64}$'
  schemas:
    Error:
      type: object
      description: >-
        The generic error body. Details never appear here; they go to the log only.
        The Go API sends not_found, method_not_allowed and internal_error. The AI
        service also sends unauthorized, payload_too_large and invalid_request.
      required: [error, request_id]
      additionalProperties: false
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z_]{0,31}$'
          description: A stable machine-readable code.
          example: not_found
        request_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{8,64}$'
          example: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    Liveness:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    CheckState:
      type: string
      enum: [ok, down]
    CheckMap:
      type: object
      description: >-
        Dependency name to state. Names match ^[a-z][a-z0-9_]{0,31}$ (OpenAPI 3.0 has no
        way to express a pattern on property names, so servers and clients enforce it in code).
        At most 8 entries.
      maxProperties: 8
      additionalProperties:
        $ref: '#/components/schemas/CheckState'
    Readiness:
      type: object
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          $ref: '#/components/schemas/CheckMap'
