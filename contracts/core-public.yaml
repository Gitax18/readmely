openapi: 3.0.3
info:
  title: Readmely core API (public listener)
  version: 0.1.0
  description: >-
    What the internet-facing port of the Go API serves. Readiness and status are NOT here: they are on the internal listener.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      responses:
        '200':
          description: The process is alive. Never touches a dependency.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              example:
                status: ok
        '405':
          description: Method not allowed (method_not_allowed).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Any other error, such as an unknown route (not_found) or an unexpected failure (internal_error).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/auth/email/start:
    post:
      operationId: startEmailLogin
      summary: Send a one-time sign-in code to an email address
      description: >-
        Answers 202 in the same way and in similar time whether or not the address has an account, so the
        form cannot be used to find out who is registered. The code is valid for 10 minutes and 5 attempts.
        A new request replaces any earlier unused code for the same address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEmailLoginRequest'
            example:
              email: ada@example.com
      responses:
        '202':
          description: Accepted. If the address can receive a code, one is on its way.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailLogin
      summary: Exchange the emailed code for a session
      description: >-
        Creates the account on a first sign-in. Sets the session cookie. Every failure (wrong, expired,
        already used or superseded code, unknown address, suspended account) is the same 400 invalid_code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailLoginRequest'
            example:
              email: ada@example.com
              code: '013842'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                user:
                  id: 01900000-0000-7000-8000-000000000001
                  email: ada@example.com
                  display_name: Ada Lovelace
                  created_at: '2026-11-18T09:30:00Z'
                csrf_token: 4f7c1e9a0b3d5c6e8f2a4b6d8e0c1a3f5b7d9e1c3a5f7b9d1e3c5a7f9b1d3e5c
        '400':
          $ref: '#/components/responses/InvalidCode'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out. The session is deleted and the cookie cleared.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user, and the CSRF token for this session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                user:
                  id: 01900000-0000-7000-8000-000000000001
                  email: ada@example.com
                  display_name: Ada Lovelace
                  created_at: '2026-11-18T09:30:00Z'
                csrf_token: 4f7c1e9a0b3d5c6e8f2a4b6d8e0c1a3f5b7d9e1c3a5f7b9d1e3c5a7f9b1d3e5c
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      operationId: updateMe
      summary: Change the display name
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              display_name: Ada Lovelace
      responses:
        '200':
          description: The updated user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 01900000-0000-7000-8000-000000000001
                email: ada@example.com
                display_name: Ada Lovelace
                created_at: '2026-11-18T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/me/sessions:
    get:
      operationId: listSessions
      summary: The signed-in user's active sessions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active sessions, newest first.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 01900000-0000-7000-8000-000000000401
                    created_at: '2026-11-18T09:30:00Z'
                    last_seen_at: '2026-11-18T10:02:11Z'
                    device: Safari on macOS
                    current: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: revokeOtherSessions
      summary: End every session except the current one
      description: Useful after losing a device. The session making the request stays signed in.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Every other session is gone.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/me/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: End one of the signed-in user's sessions
      description: A session that belongs to someone else is indistinguishable from one that does not exist (404).
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The session is gone.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/me/deletion/start:
    post:
      operationId: startAccountDeletion
      summary: Email a code that confirms deleting the account
      description: >-
        Deleting an account cannot be undone, so being signed in is not enough: a one-time code is sent to
        the account's own address and must be entered to confirm. The code is valid for 10 minutes and 5 attempts.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Accepted. A code is on its way to the account's address.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                status: accepted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/me/deletion/confirm:
    post:
      operationId: confirmAccountDeletion
      summary: Delete the account and everything in it
      description: >-
        Removes the user, their sessions, connected accounts, projects and jobs. Credit ledger entries are kept
        for accounting with the user reference removed. The session cookie is cleared. A wrong, expired or used
        code is one error.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDeletionRequest'
            example:
              code: '123456'
      responses:
        '204':
          description: The account is deleted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/projects/preview:
    post:
      operationId: previewRepository
      summary: Look up a public GitHub repository before adding it
      description: >-
        Takes what a person pastes (https://github.com/owner/repo, with or without the scheme, ".git" or a trailing
        path) and answers with what GitHub says about it, without creating anything. Errors: invalid_request (not a
        github.com repository address), repository_not_found (missing or private), repository_too_large (over the
        size limit) and github_unavailable (GitHub is not answering or is rate limiting).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryUrlRequest'
            example:
              url: https://github.com/octocat/Hello-World
      responses:
        '200':
          description: The repository exists, is public and is small enough.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPreview'
              example:
                owner: octocat
                name: Hello-World
                description: My first repository on GitHub!
                default_branch: master
                size_kb: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotAvailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/projects:
    get:
      operationId: listProjects
      summary: The signed-in user's projects, newest first
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The projects, each with its latest analysis job.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
              example:
                projects: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createProject
      summary: Add a public GitHub repository as a project
      description: >-
        Checks the repository the same way as the preview, then creates the project (status draft). At most 10
        projects per user (409 project_limit); the same repository twice is 409 already_added. Analysis starts
        with a separate request.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryUrlRequest'
            example:
              url: https://github.com/octocat/Hello-World
      responses:
        '201':
          description: The project was created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotAvailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/projects/{id}:
    get:
      operationId: getProject
      summary: One project with its latest analysis job
      description: Someone else's project is indistinguishable from one that does not exist (404). The page polls this while a job runs.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: deleteProject
      summary: Delete a project and everything generated for it
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: The project is gone.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/projects/{id}/analyse:
    post:
      operationId: analyseProject
      summary: Start analysing a project
      description: >-
        Queues the analysis job and sets the project to importing. Only one analysis runs per project at a
        time (409 analysis_running).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: The job is queued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/projects/{id}/analysis:
    get:
      operationId: getProjectAnalysis
      summary: What the last analysis found
      description: >-
        The facts the analysis produced (languages, frameworks, commands, entry points, environment
        variables, secrets found and removed) and the most imported files. 404 until a first analysis has
        finished, and for someone else's project.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The analysis.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAnalysis'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/auth/providers:
    get:
      operationId: listAuthProviders
      summary: Which sign-in providers are configured
      description: Providers without credentials are off and never listed. The login page shows a button for each one listed.
      responses:
        '200':
          description: The configured providers, possibly none.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
              example:
                providers: [google, github]
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/auth/{provider}/start:
    get:
      operationId: startOAuthLogin
      summary: Begin signing in with a provider
      description: >-
        Redirects the browser to the provider's authorization page and sets a short-lived cookie that
        binds the attempt to this browser. 404 when the provider is unknown or not configured.
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '302':
          description: Redirect to the provider.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/OAuthCookie'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/auth/{provider}/callback:
    get:
      operationId: finishOAuthLogin
      summary: The provider sends the browser back here
      description: >-
        Always answers with a redirect. Success goes to /account with the session cookie set; every
        failure goes to /login?error=CODE, where CODE is one of access_denied, invalid_state,
        no_verified_email, provider_conflict, identity_in_use, unsupported_email, provider_error,
        account_unavailable. Nothing the provider sends is ever shown or logged.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        '302':
          description: Redirect to /account or /login?error=CODE. Clears the attempt cookie; on success also sets the session cookie.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/OAuthCookie'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/me/identities:
    get:
      operationId: listIdentities
      summary: The signed-in user's connected provider accounts
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Connected accounts, at most one per provider.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityList'
              example:
                identities:
                  - provider: google
                    email: ada@example.com
                    created_at: '2026-11-23T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/me/identities/{provider}/start:
    post:
      operationId: startConnectIdentity
      summary: Begin connecting a provider account to this user
      description: >-
        A POST with the CSRF token, never a GET, so another site cannot make a victim attach the
        attacker's provider account. Returns the provider's authorization URL; the page navigates to it.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Where to send the browser. Also sets the attempt cookie.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/OAuthCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationUrl'
              example:
                authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=example
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /v1/me/identities/{provider}:
    delete:
      operationId: disconnectIdentity
      summary: Disconnect a provider account from this user
      description: Always allowed, because email codes keep working. 404 when that provider is not connected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Disconnected.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  headers:
    RequestId:
      description: The request ID, echoed back or generated by the server.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{8,64}$'
    SessionCookie:
      description: >-
        The session cookie: set on sign-in, cleared (Max-Age=0) on sign-out.
        Always __Host-rm_session=...; Path=/; Secure; HttpOnly; SameSite=Lax.
      required: true
      schema:
        type: string
    Location:
      description: Where the browser is sent next.
      required: true
      schema:
        type: string
        maxLength: 2048
    OAuthCookie:
      description: >-
        The sign-in attempt cookie: set at the start (Max-Age=600), cleared by the callback. Always
        __Host-rm_oauth=...; Path=/; Secure; HttpOnly; SameSite=Lax. The callback may also set the session cookie.
      required: true
      schema:
        type: string
  schemas:
    Provider:
      type: string
      enum: [google, github]
    AuthProviders:
      type: object
      required: [providers]
      additionalProperties: false
      properties:
        providers:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Provider'
    Identity:
      type: object
      required: [provider, email, created_at]
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        email:
          type: string
          description: The address the provider reported when the account was connected.
        created_at:
          type: string
          format: date-time
    IdentityList:
      type: object
      required: [identities]
      additionalProperties: false
      properties:
        identities:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Identity'
    AuthorizationUrl:
      type: object
      required: [authorization_url]
      additionalProperties: false
      properties:
        authorization_url:
          type: string
          format: uri
          maxLength: 2048
    Error:
      type: object
      description: >-
        The generic error body. Details never appear here; they go to the log only.
        The Go API sends not_found, method_not_allowed and internal_error. The AI
        service also sends unauthorized, payload_too_large and invalid_request.
      required: [error, request_id]
      additionalProperties: false
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z_]{0,31}$'
          description: A stable machine-readable code.
          example: not_found
        request_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{8,64}$'
          example: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    Liveness:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    CheckState:
      type: string
      enum: [ok, down]
    CheckMap:
      type: object
      description: >-
        Dependency name to state. Names match ^[a-z][a-z0-9_]{0,31}$ (OpenAPI 3.0 has no
        way to express a pattern on property names, so servers and clients enforce it in code).
        At most 8 entries.
      maxProperties: 8
      additionalProperties:
        $ref: '#/components/schemas/CheckState'
    Readiness:
      type: object
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          $ref: '#/components/schemas/CheckMap'
    Accepted:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [accepted]
    StartEmailLoginRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          example: ada@example.com
    VerifyEmailLoginRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        code:
          type: string
          pattern: '^[0-9]{6}$'
    ConfirmDeletionRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    RepositoryUrlRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 300
    RepositoryPreview:
      type: object
      required: [owner, name, description, default_branch, size_kb]
      additionalProperties: false
      properties:
        owner:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
        name:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,100}$'
        description:
          type: string
          maxLength: 500
          description: Empty when the repository has none. Plain text.
        default_branch:
          type: string
        size_kb:
          type: integer
          minimum: 0
    ProjectJob:
      type: object
      description: The latest analysis job of a project.
      required: [id, status, step, progress, error_code, created_at, finished_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        step:
          type: string
          nullable: true
          description: What the worker is doing now, a short code such as fetching or scanning.
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error_code:
          type: string
          nullable: true
          description: A short code, never provider or stack text.
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    Project:
      type: object
      required: [id, name, owner, repo, description, default_branch, size_kb, status, created_at, updated_at, job]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: owner/repo
        owner:
          type: string
        repo:
          type: string
        description:
          type: string
        default_branch:
          type: string
        size_kb:
          type: integer
        status:
          type: string
          enum: [draft, importing, ready, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        job:
          allOf:
            - $ref: '#/components/schemas/ProjectJob'
          nullable: true
          description: Null until the first analysis is requested.
    ProjectAnalysis:
      type: object
      required: [commit_sha, analysed_at, facts, hubs]
      additionalProperties: false
      properties:
        commit_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        analysed_at:
          type: string
          format: date-time
        facts:
          $ref: '#/components/schemas/ProjectFacts'
        hubs:
          type: array
          maxItems: 10
          description: The files other files import most, with how many do.
          items:
            $ref: '#/components/schemas/Hub'
    Hub:
      type: object
      required: [kind, key, imported_by]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [file, package, external]
        key:
          type: string
        imported_by:
          type: integer
    ProjectFacts:
      type: object
      required: [languages, frameworks, package_managers, entry_points, commands, env_vars, services, license, has_readme, has_tests, has_ci, has_docker, totals, directories, secrets, skipped]
      additionalProperties: false
      properties:
        languages:
          type: array
          maxItems: 8
          items:
            type: object
            required: [name, files, lines, percent]
            additionalProperties: false
            properties:
              name:
                type: string
              files:
                type: integer
              lines:
                type: integer
              percent:
                type: number
        frameworks:
          type: array
          maxItems: 24
          items:
            type: string
        package_managers:
          type: array
          items:
            type: string
        entry_points:
          type: array
          maxItems: 10
          items:
            type: string
        commands:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, source]
            additionalProperties: false
            properties:
              name:
                type: string
              source:
                type: string
        env_vars:
          type: array
          maxItems: 60
          items:
            type: string
        services:
          type: array
          items:
            type: string
        license:
          type: string
          nullable: true
        has_readme:
          type: boolean
        has_tests:
          type: boolean
        has_ci:
          type: boolean
        has_docker:
          type: boolean
        totals:
          type: object
          required: [files, source_files, lines, bytes]
          additionalProperties: false
          properties:
            files:
              type: integer
            source_files:
              type: integer
            lines:
              type: integer
            bytes:
              type: integer
        directories:
          type: array
          maxItems: 15
          items:
            type: object
            required: [path, files]
            additionalProperties: false
            properties:
              path:
                type: string
              files:
                type: integer
        secrets:
          type: object
          required: [count, by_rule, locations]
          additionalProperties: false
          description: Secret-like values found and removed. Only where they were, never the value.
          properties:
            count:
              type: integer
            by_rule:
              type: object
              additionalProperties:
                type: integer
            locations:
              type: array
              maxItems: 50
              items:
                type: object
                required: [path, line, rule]
                additionalProperties: false
                properties:
                  path:
                    type: string
                  line:
                    type: integer
                  rule:
                    type: string
        skipped:
          type: object
          required: [count, by_reason]
          additionalProperties: false
          properties:
            count:
              type: integer
            by_reason:
              type: object
              additionalProperties:
                type: integer
    ProjectList:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Project'
    UpdateMeRequest:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          description: No control characters (enforced by the server).
    User:
      type: object
      required: [id, email, display_name, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
          description: Empty until the user sets one.
        created_at:
          type: string
          format: date-time
    Me:
      type: object
      required: [user, csrf_token]
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
    Session:
      type: object
      required: [id, created_at, last_seen_at, device, current]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: A handle for revoking this session. It is not the cookie value.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        device:
          type: string
          maxLength: 100
          description: A short label made from the user agent, such as "Safari on macOS". Empty if unknown.
        current:
          type: boolean
    SessionList:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Session'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rm_session
      description: >-
        Opaque 256-bit token. Set with Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain. Only its hash is stored.
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Provider'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The csrf_token from GET /v1/me, bound to the current session. Required on every state-changing request that has a session.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  responses:
    BadRequest:
      description: The request is malformed or breaks a rule (invalid_request).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_request
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    InvalidCode:
      description: The code is wrong, expired, used, superseded, or the account cannot sign in (invalid_code). One answer for all of them.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_code
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    Unauthenticated:
      description: No valid session (unauthenticated).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    Forbidden:
      description: Missing or wrong CSRF token, foreign Origin, or a body that is not JSON (forbidden).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    Conflict:
      description: The request conflicts with the current state, such as a provider that is already connected (conflict).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: conflict
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    NotAvailable:
      description: A service this request depends on is not answering (github_unavailable). Try again shortly.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: github_unavailable
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    NotFound:
      description: No such resource for this user (not_found).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    RateLimited:
      description: Too many requests (rate_limited). Wait Retry-After seconds.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          required: true
          description: Seconds until the request may be tried again.
          schema:
            type: integer
            minimum: 1
            maximum: 86400
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limited
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    UnexpectedError:
      description: Any other error, such as a method that is not allowed or an unexpected failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            request_id: 6P5E3ETHKJKOTOXXMXCEJGDW6I
