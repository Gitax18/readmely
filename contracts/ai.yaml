openapi: 3.0.3
info:
  title: Readmely AI service
  version: 0.1.0
  description: >-
    Internal only: no port is published to the host. Called by the Go core with the service token.
servers:
  - url: http://ai:8000
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness (no token needed; used by the container probe)
      security: []
      responses:
            '200':
              description: The process is alive. Never touches a dependency.
              headers:
                X-Request-ID:
                  $ref: '#/components/headers/RequestId'
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Liveness'
                  example:
                    status: ok
            '405':
              description: Method not allowed (method_not_allowed).
              headers:
                X-Request-ID:
                  $ref: '#/components/headers/RequestId'
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            default:
              description: Any other error, such as an unknown route (not_found) or an unexpected failure (internal_error).
              headers:
                X-Request-ID:
                  $ref: '#/components/headers/RequestId'
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness of the AI service's dependencies
      security:
        - serviceToken: []
      responses:
        '200':
          description: Every dependency answered.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ready
                checks: {postgres: ok}
        '503':
          description: At least one dependency is down. The reason is logged, never returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: unavailable
                checks: {postgres: down}
        '401':
          description: >-
            Missing, malformed or wrong service token. All three look identical (unauthorized),
            so a caller learns nothing about which part failed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            WWW-Authenticate:
              schema:
                type: string
                enum: [Bearer]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed (method_not_allowed).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Any other error, such as an unknown route (not_found), oversized body (payload_too_large), invalid input (invalid_request) or an unexpected failure (internal_error).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: >-
        The shared AI_SERVICE_TOKEN (at least 32 characters), compared in constant time.
  headers:
    RequestId:
      description: The request ID, echoed back or generated by the server.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{8,64}$'
  schemas:
    Error:
      type: object
      description: >-
        The generic error body. Details never appear here; they go to the log only.
        The Go API sends not_found, method_not_allowed and internal_error. The AI
        service also sends unauthorized, payload_too_large and invalid_request.
      required: [error, request_id]
      additionalProperties: false
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z_]{0,31}$'
          description: A stable machine-readable code.
          example: not_found
        request_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{8,64}$'
          example: 6P5E3ETHKJKOTOXXMXCEJGDW6I
    Liveness:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    CheckState:
      type: string
      enum: [ok, down]
    CheckMap:
      type: object
      description: >-
        Dependency name to state. Names match ^[a-z][a-z0-9_]{0,31}$ (OpenAPI 3.0 has no
        way to express a pattern on property names, so servers and clients enforce it in code).
        At most 8 entries.
      maxProperties: 8
      additionalProperties:
        $ref: '#/components/schemas/CheckState'
    Readiness:
      type: object
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          $ref: '#/components/schemas/CheckMap'
