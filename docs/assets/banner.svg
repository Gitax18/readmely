<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Readmely</title>
  <desc id="desc">From repository to README, architecture diagrams and AI context packs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2125"/>
      <stop offset="0.55" stop-color="#132b30"/>
      <stop offset="1" stop-color="#173b40"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1ba99b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1ba99b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
    <clipPath id="mark"><rect x="80" y="84" width="76" height="76" rx="18"/></clipPath>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9f1eb"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <circle cx="1060" cy="300" r="300" fill="url(#glow)"/>
    <circle cx="60" cy="-20" r="180" fill="url(#glow)" opacity="0.5"/>

    <!-- Logo mark (same as the app icon) -->
    <g clip-path="url(#mark)">
      <rect x="80" y="84" width="76" height="76" fill="#0b1c1f"/>
      <circle cx="146" cy="150" r="27" fill="#1ba99b"/>
    </g>
    <rect x="80.5" y="84.5" width="75" height="75" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="118" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">R</text>

    <!-- Wordmark and tagline -->
    <text x="178" y="143" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#word)">Readmely</text>
    <text x="82" y="204" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" fill="#a7cbc6">From repository to README, diagrams and AI context.</text>

    <!-- Output chips -->
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
      <rect x="82" y="230" width="104" height="34" rx="17" fill="#1ba99b" fill-opacity="0.16" stroke="#1ba99b" stroke-opacity="0.7"/>
      <text x="134" y="252" text-anchor="middle" fill="#7fe0d4">README</text>
      <rect x="198" y="230" width="112" height="34" rx="17" fill="#f2b84b" fill-opacity="0.14" stroke="#f2b84b" stroke-opacity="0.7"/>
      <text x="254" y="252" text-anchor="middle" fill="#f7cf7f">Diagrams</text>
      <rect x="322" y="230" width="140" height="34" rx="17" fill="#7aa2f7" fill-opacity="0.14" stroke="#7aa2f7" stroke-opacity="0.7"/>
      <text x="392" y="252" text-anchor="middle" fill="#a9c1fa">Context packs</text>
    </g>

    <!-- Code panel -->
    <g transform="translate(790 64)">
      <rect width="190" height="196" rx="14" fill="#0b1c1f" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="18" cy="18" r="4.5" fill="#ff6b6b"/>
      <circle cx="33" cy="18" r="4.5" fill="#f2b84b"/>
      <circle cx="48" cy="18" r="4.5" fill="#1ba99b"/>
      <g>
        <rect x="18" y="40" width="34" height="8" rx="4" fill="#c792ea"/>
        <rect x="58" y="40" width="70" height="8" rx="4" fill="#e6edf3" fill-opacity="0.75"/>
        <rect x="30" y="60" width="44" height="8" rx="4" fill="#7aa2f7"/>
        <rect x="80" y="60" width="62" height="8" rx="4" fill="#f2b84b"/>
        <rect x="30" y="80" width="28" height="8" rx="4" fill="#c792ea"/>
        <rect x="64" y="80" width="92" height="8" rx="4" fill="#1ba99b"/>
        <rect x="42" y="100" width="58" height="8" rx="4" fill="#e6edf3" fill-opacity="0.5"/>
        <rect x="106" y="100" width="40" height="8" rx="4" fill="#7aa2f7"/>
        <rect x="30" y="120" width="20" height="8" rx="4" fill="#e6edf3" fill-opacity="0.5"/>
        <rect x="18" y="140" width="40" height="8" rx="4" fill="#c792ea"/>
        <rect x="64" y="140" width="76" height="8" rx="4" fill="#f2b84b"/>
        <rect x="30" y="160" width="96" height="8" rx="4" fill="#1ba99b"/>
      </g>
    </g>

    <!-- Arrow -->
    <g fill="none" stroke="#1ba99b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M992 162 H1022" stroke-dasharray="2 7"/>
      <path d="M1018 152 L1030 162 L1018 172"/>
    </g>

    <!-- Generated document -->
    <g transform="translate(1042 44)">
      <rect width="186" height="236" rx="14" fill="#f7faf9"/>
      <rect x="18" y="20" width="92" height="12" rx="6" fill="#132b30"/>
      <rect x="18" y="42" width="36" height="10" rx="3" fill="#1ba99b"/>
      <rect x="58" y="42" width="36" height="10" rx="3" fill="#7aa2f7"/>
      <rect x="98" y="42" width="36" height="10" rx="3" fill="#f2b84b"/>
      <rect x="18" y="64" width="150" height="6" rx="3" fill="#c9d6d4"/>
      <rect x="18" y="78" width="128" height="6" rx="3" fill="#c9d6d4"/>
      <rect x="18" y="92" width="140" height="6" rx="3" fill="#c9d6d4"/>
      <!-- Mini architecture diagram -->
      <g stroke="#8aa3a0" stroke-width="2" fill="none">
        <path d="M58 132 H84"/>
        <path d="M120 142 V160 H58 V172"/>
        <path d="M120 142 V172"/>
      </g>
      <rect x="18" y="120" width="40" height="24" rx="6" fill="#1ba99b"/>
      <rect x="84" y="120" width="72" height="24" rx="6" fill="#132b30"/>
      <rect x="30" y="172" width="56" height="24" rx="6" fill="#7aa2f7"/>
      <rect x="98" y="172" width="58" height="24" rx="6" fill="#f2b84b"/>
      <rect x="18" y="212" width="112" height="6" rx="3" fill="#c9d6d4"/>
    </g>
  </g>
</svg>
