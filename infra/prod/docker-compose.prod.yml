# Production stack: one EC2 instance, everything behind Caddy. See docs/deploy/aws.md.
#
# Run on the instance by scripts/deploy.sh, which writes /opt/readmely/.env from SSM Parameter Store:
#   docker compose --env-file /opt/readmely/.env -f docker-compose.prod.yml up -d
#
# Only Caddy publishes ports (80 for the ACME challenge and the HTTPS redirect, 443 for the API).
# Postgres, Redis and the services are reachable on the internal network only. Memory limits keep
# the whole stack inside a 2 GB t3.small; measure with `docker stats` before changing them.
name: readmely

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    mem_limit: 64m
    cap_add: [NET_BIND_SERVICE]
    environment:
      API_HOST: ${API_HOST:?API_HOST is not set}
      ORIGIN_KEY: ${ORIGIN_KEY:?ORIGIN_KEY is not set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      edge:
        # Fixed, so the API can trust exactly this address in TRUSTED_PROXIES.
        ipv4_address: 172.30.0.10
    depends_on:
      api:
        condition: service_healthy

  postgres:
    <<: *hardening
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    mem_limit: 384m
    # Postgres needs a writable root for its socket and run files.
    read_only: false
    # The entrypoint switches from root to the postgres user, so it needs these back.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    shm_size: 128m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    <<: *hardening
    image: redis:8.2.11-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
    mem_limit: 96m
    # Runs as the image's redis user from the start, so it needs no capabilities at all.
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations as the owner role, then sets the service roles' passwords.
  # deploy.sh runs it before starting the services: `docker compose --profile migrate run --rm migrate up`.
  migrate:
    <<: *hardening
    profiles: ["migrate"]
    restart: "no"
    image: ${ECR_REGISTRY:?ECR_REGISTRY is not set}/readmely/migrate:${IMAGE_TAG:?IMAGE_TAG is not set}
    mem_limit: 128m
    environment:
      APP_ENV: production
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is not set}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is not set}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    <<: *hardening
    image: ${ECR_REGISTRY:?ECR_REGISTRY is not set}/readmely/api:${IMAGE_TAG:?IMAGE_TAG is not set}
    mem_limit: 128m
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      # Status detail lives here. Caddy forwards /_internal/* to it only with the origin key.
      INTERNAL_ADDR: "0.0.0.0:8081"
      # Only Caddy's fixed address: X-Forwarded-For is believed from Caddy and nobody else.
      TRUSTED_PROXIES: 172.30.0.10/32
      # Requests per visitor per minute before 429s and, after repeated refusals, a temporary block
      # (internal/guard). Set /readmely/prod/GUARD_PER_MINUTE to 0 in SSM and redeploy to turn it off.
      GUARD_PER_MINUTE: ${GUARD_PER_MINUTE:-300}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is not set}
      DATABASE_URL: postgres://readmely_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_CODE_KEY: ${AUTH_CODE_KEY:?AUTH_CODE_KEY is not set}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is not set}
      MAILER: smtp
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is not set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is not set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is not set}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is not set}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Readmely}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GITHUB_TOKEN_KEY: ${GITHUB_TOKEN_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      internal: {}
      edge: {}
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Claims analysis jobs from the Postgres queue. Unpacks repositories in memory (up to 600 MB
  # uncompressed, see services/core/internal/ingest/extract.go), so it gets the largest limit.
  ingest:
    <<: *hardening
    image: ${ECR_REGISTRY:?ECR_REGISTRY is not set}/readmely/ingest:${IMAGE_TAG:?IMAGE_TAG is not set}
    mem_limit: 768m
    environment:
      APP_ENV: production
      GITHUB_TOKEN_KEY: ${GITHUB_TOKEN_KEY:-}
      DATABASE_URL: postgres://readmely_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  ai:
    <<: *hardening
    image: ${ECR_REGISTRY:?ECR_REGISTRY is not set}/readmely/ai:${IMAGE_TAG:?IMAGE_TAG is not set}
    mem_limit: 192m
    environment:
      APP_ENV: production
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8000"
      DATABASE_URL: postgresql://readmely_ai:${AI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is not set}
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-m", "app.probe"]
      interval: 10s
      timeout: 3s
      retries: 10

  ai-worker:
    <<: *hardening
    image: ${ECR_REGISTRY:?ECR_REGISTRY is not set}/readmely/ai:${IMAGE_TAG:?IMAGE_TAG is not set}
    command: ["python", "-m", "app.worker"]
    mem_limit: 256m
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://readmely_ai:${AI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_DAILY_CAP_USD: ${LLM_DAILY_CAP_USD:-3}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-gpt-4o-mini}
      LLM_FAST_INPUT_USD_PER_MTOK: ${LLM_FAST_INPUT_USD_PER_MTOK:-0.15}
      LLM_FAST_OUTPUT_USD_PER_MTOK: ${LLM_FAST_OUTPUT_USD_PER_MTOK:-0.60}
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  # Postgres, Redis and the services. No route to the outside world is needed for Postgres and
  # Redis, but the API, ingest and AI worker call GitHub, SMTP and OpenAI, so it is not `internal: true`.
  internal: {}
  # Caddy and the API only.
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
