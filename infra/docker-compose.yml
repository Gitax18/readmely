# Local development stack. Data stores only for now; services are added in later steps.
# Run through the root Makefile (`make up`), which passes the .env file.
name: readmely

services:
  postgres:
    # Pinned by digest (audit F9): a tag can be moved to different contents. Dependabot updates both.
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    ports:
      # Bound to localhost only: never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2.11-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local development.
  # Production uses a managed S3 service (DigitalOcean Spaces or AWS S3).
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is not set in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is not set in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Go API. Started with `make up-app`; `make run-api` runs it on the host instead.
  # Do not run both at once, they use the same port.
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/core.Dockerfile
      args:
        CMD: api
    image: readmely/api:dev
    restart: unless-stopped
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      # /readyz lives here. Reachable on the internal network only: never add it to `ports`.
      INTERNAL_ADDR: "0.0.0.0:8081"
      # The status report asks the AI service for its readiness with this token.
      # Without a token the report says "unconfigured" and no request is made.
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # The API logs in as a limited role that can change data but never the schema.
      DATABASE_URL: postgres://readmely_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is not set in .env}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      # Sign-in (Phase 2a). Locally, codes are written to the API's log (MAILER=log).
      AUTH_CODE_KEY: ${AUTH_CODE_KEY:?AUTH_CODE_KEY is not set in .env (openssl rand -hex 32)}
      WEB_ORIGIN: http://127.0.0.1:${WEB_PORT:-3000}
      MAILER: log
      # Provider sign-in (Phase 2b): empty means the provider is off.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Optional: a read-only token that only raises GitHub's rate limit for repository lookups.
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The repository analysis worker. It claims analysis jobs from the Postgres queue; it has no port.
  # Phase 4 adds the clone sandbox (egress limited to GitHub, resource limits) to this service.
  ingest:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/core.Dockerfile
      args:
        CMD: ingest
    image: readmely/ingest:dev
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://readmely_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is not set in .env}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The AI worker: runs summary jobs and is the only process that calls a model provider. It logs in
  # as the AI role. With no OPENAI_API_KEY it still runs: its jobs fail cleanly and are refunded.
  ai-worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/ai.Dockerfile
    image: readmely/ai:dev
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://readmely_ai:${AI_DB_PASSWORD:?AI_DB_PASSWORD is not set in .env}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_DAILY_CAP_USD: ${LLM_DAILY_CAP_USD:-3}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-gpt-4o-mini}
      LLM_FAST_INPUT_USD_PER_MTOK: ${LLM_FAST_INPUT_USD_PER_MTOK:-0.15}
      LLM_FAST_OUTPUT_USD_PER_MTOK: ${LLM_FAST_OUTPUT_USD_PER_MTOK:-0.60}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The Python AI service. Internal only: no port is published to the host.
  # Started with `make up-app`; `make run-ai` runs it on the host instead (bound to 127.0.0.1).
  ai:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/ai.Dockerfile
    image: readmely/ai:dev
    restart: unless-stopped
    environment:
      APP_ENV: development
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8000"
      # The AI service logs in as its own role, which can read only what its features are granted.
      DATABASE_URL: postgresql://readmely_ai:${AI_DB_PASSWORD:?AI_DB_PASSWORD is not set in .env}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      # Left empty when unset, so `make up` still works; the service itself then
      # refuses to start and says AI_SERVICE_TOKEN is required.
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "app.probe"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Next.js web app. The only service meant to face users; published on
  # 127.0.0.1 only. Its server talks to the Go API's internal listener, so the
  # browser never sees that address or the status detail beyond STATUS_DETAIL.
  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    image: readmely/web:dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8081
      # The account pages and the same-origin /api bridge talk to the PUBLIC listener only
      # (audit F14); the internal one (readiness, status detail) is never reachable from a browser.
      API_PUBLIC_URL: http://api:8080
      # The image runs in production mode, which defaults to "coarse". Locally
      # we want the detail; set STATUS_DETAIL=coarse in .env to see production's view.
      STATUS_DETAIL: ${STATUS_DETAIL:-full}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Distroless has no shell or curl: probe with Node itself.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rustfs-data:

networks:
  internal:
