name: CI

# Every job calls the same make targets as `make check`, so CI and a laptop agree.
# No secrets are used. Third-party actions are pinned to full commit SHAs (the
# version is in the comment); Dependabot keeps them current.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.0"
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "12.10.1"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-commit-msg.py --range "$BASE..$HEAD"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum pinned in this file)
        run: |
          set -euo pipefail
          v=8.30.1
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the commits this change adds (the whole history on main)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD"; else range="HEAD"; fi
          make secrets SECRETS_LOG_OPTS="$range"

  workflows:
    name: Workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/core/go.mod
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - run: make lint-go test-go audit-go

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - run: make lint-ai test-ai audit-ai

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "pnpm@${PNPM_VERSION}"
      - run: make lint-web test-web audit-web
      - run: pnpm run build
        working-directory: apps/web

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "pnpm@${PNPM_VERSION}"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - run: make lint-tools contracts-check test-scripts gen-check

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "pnpm@${PNPM_VERSION}"
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: make test-e2e

  integration:
    name: Integration (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock
      - name: Create a throwaway .env with generated passwords
        run: |
          set -euo pipefail
          cp .env.example .env
          for v in POSTGRES_PASSWORD REDIS_PASSWORD RUSTFS_SECRET_KEY APP_DB_PASSWORD AI_DB_PASSWORD; do
            sed -i "s|^${v}=.*|${v}=$(openssl rand -hex 24)|" .env
          done
          sed -i "s|^AI_SERVICE_TOKEN=.*|AI_SERVICE_TOKEN=$(openssl rand -hex 32)|" .env
          sed -i "s|^AUTH_CODE_KEY=.*|AUTH_CODE_KEY=$(openssl rand -hex 32)|" .env
      - run: make up
      - run: make verify
      - run: make test-integration
      - run: make up-app
      - name: The status page reports every service operational
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ | grep -q "All systems operational"; then
              echo "status page: all systems operational"
              exit 0
            fi
            sleep 2
          done
          echo "the status page never reported all systems operational" >&2
          curl -sS http://127.0.0.1:3000/ | head -c 2000 >&2 || true
          exit 1
      - name: Container logs (on failure)
        if: failure()
        run: docker compose --env-file ./.env -f infra/docker-compose.yml --profile app logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: make reset

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space (six images plus the scanner database do not fit otherwise)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: make docker-build
      - name: Scan the images for fixed high and critical vulnerabilities
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          for image in api ingest render migrate ai web; do
            docker run -v /var/run/docker.sock:/var/run/docker.sock -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "readmely/${image}:dev"
          done

  ci-ok:
    name: ci-ok
    if: always()
    needs: [commits, secrets, workflows, go, python, web, contracts, e2e, integration, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded (this is the one required check)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          bad = {name: r for name, r in results.items() if r != "success"}
          print(json.dumps(results, indent=2))
          sys.exit(1 if bad else 0)
          PY
