# Each pull request title starts with a type and scope the commit check accepts (the default
# "deps" scope is refused by scripts/check-commit-msg.py), so every ecosystem sets a prefix.
# Weekly update pull requests, one group per ecosystem. The 7-day cooldown matches
# the package-age rule already used for pnpm: a release must be a week old first.
#
# Major upgrades (and new language versions: Python and Go minors, Node majors) are never
# proposed here (audit F7). They change the toolchain the repo pins in .python-version, go.mod
# and package.json engines, so each one is a planned change, not a weekly bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: gomod
    directory: /services/core
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(core)" }
    groups:
      go: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /services/ai
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(ai)" }
    groups:
      python: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(web)" }
    groups:
      web: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(infra)" }
    groups:
      images: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A new minor is a new language version for these.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor"]

  # The data stores in the local stack and CI (audit F9).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(infra)" }
    groups:
      compose: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A Redis minor is a server upgrade with its own release notes.
      - dependency-name: "redis"
        update-types: ["version-update:semver-minor"]
